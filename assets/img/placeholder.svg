<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"
     role="img" aria-label="Screenshot coming soon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a9cdf0"/>
      <stop offset="60%"  stop-color="#6ea8dc"/>
      <stop offset="100%" stop-color="#8fa9c4"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#22262c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- skyline -->
  <g fill="#27486f" opacity="0.55">
    <rect x="20"  y="150" width="70"  height="180"/>
    <rect x="100" y="200" width="50"  height="130"/>
    <rect x="160" y="120" width="60"  height="210"/>
    <rect x="230" y="180" width="80"  height="150"/>
    <rect x="325" y="95"  width="55"  height="235"/>
    <rect x="395" y="165" width="75"  height="165"/>
    <rect x="485" y="135" width="60"  height="195"/>
    <rect x="560" y="205" width="70"  height="125"/>
    <rect x="645" y="150" width="55"  height="180"/>
    <rect x="715" y="195" width="65"  height="135"/>
  </g>

  <!-- windows -->
  <g fill="#ffc229" opacity="0.35">
    <rect x="32"  y="170" width="8" height="10"/>
    <rect x="52"  y="200" width="8" height="10"/>
    <rect x="338" y="120" width="8" height="10"/>
    <rect x="358" y="160" width="8" height="10"/>
    <rect x="500" y="180" width="8" height="10"/>
    <rect x="660" y="190" width="8" height="10"/>
  </g>

  <!-- road -->
  <rect x="0" y="330" width="800" height="120" fill="url(#road)"/>
  <g fill="#f2f2f2" opacity="0.75">
    <rect x="20"  y="392" width="60" height="7"/>
    <rect x="130" y="392" width="60" height="7"/>
    <rect x="240" y="392" width="60" height="7"/>
    <rect x="350" y="392" width="60" height="7"/>
    <rect x="460" y="392" width="60" height="7"/>
    <rect x="570" y="392" width="60" height="7"/>
    <rect x="680" y="392" width="60" height="7"/>
  </g>

  <!-- bus -->
  <g transform="translate(250 250)">
    <rect x="0" y="0" width="300" height="90" rx="6" fill="#ff7a18" stroke="#142a44" stroke-width="4"/>
    <rect x="12" y="14" width="70" height="34" fill="#a9cdf0" stroke="#142a44" stroke-width="3"/>
    <rect x="96" y="14" width="70" height="34" fill="#a9cdf0" stroke="#142a44" stroke-width="3"/>
    <rect x="180" y="14" width="70" height="34" fill="#a9cdf0" stroke="#142a44" stroke-width="3"/>
    <circle cx="62"  cy="94" r="18" fill="#16202c"/>
    <circle cx="62"  cy="94" r="7"  fill="#8fa9c4"/>
    <circle cx="238" cy="94" r="18" fill="#16202c"/>
    <circle cx="238" cy="94" r="7"  fill="#8fa9c4"/>
  </g>

  <text x="400" y="425" text-anchor="middle"
        font-family="Verdana, Geneva, sans-serif" font-size="17" font-weight="bold"
        fill="#ffc229">SCREENSHOT COMING SOON</text>
</svg>
