# ---------------------------------------------------------------------------
# Screenshot gallery.
#
# To add a shot:
#   1. Put the full-size image in  assets/img/screens/
#   2. Put a ~600px wide copy in   assets/img/thumbs/   (optional but faster)
#   3. Add three lines here. Newest first.
#
# If `thumb` is left out, the full-size file is used for the thumbnail too.
# If `file` is left out, the card shows a plain colour block instead.
#
# `world` puts the shot in one of the gallery's subsections. Use an id from
# _data/worlds.yml. A shot with no `world` only shows up under ALL.
# ---------------------------------------------------------------------------

