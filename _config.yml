# ---------------------------------------------------------------------------
# onurb - site configuration
# Edit the values in this file, then commit. GitHub Pages rebuilds on push.
# ---------------------------------------------------------------------------

title:    "onurb"
subtitle: "A driving simulator built on OMSI 2"
tagline:  "Drive OMSI 2 vehicles in various worlds."
email:    ""
author:   "Thiago"
description: >-
  onurb is a simulator written in C++ as a personal project, with some (maybe)
  very specific requirements of mine. Its foundation and prime directive is
  to drive OMSI 2 vehicles in several worlds. It follows the behaviour of
  OMSI 2 and loads its original maps, buses and objects as they are, and the
  same engine also drives Midtown Madness 2 and GTA: Vice City worlds, plus
  its own driveable maps generated from OpenStreetMap and open geospatial
  data, starting with Rio de Janeiro.

# --- Where the site lives -------------------------------------------------
# Served from the repository `onurbsim.github.io` on the GitHub organisation
# `onurbsim`, which GitHub publishes at the bare domain - so no baseurl.
url:     "https://onurbsim.github.io"
baseurl: ""
# ---------------------------------------------------------------------------

# Next release, shown on the home page and the About page.
release:
  version: "0.1"
  date:    "Fall 2026"

# Leave empty until a build is out. Once set, the home page shows a
# download button instead of the "coming" notice.
download_url: ""

# Scrolling ticker under the navigation bar. Keep it short.
ticker: "*** WELCOME TO THE ONURB HOMEPAGE *** VERSION 0.1 COMING FALL 2026 *** NOW DRIVING MIDTOWN MADNESS 2 AND VICE CITY *** RIO DE JANEIRO FROM OPENSTREETMAP COMING SOON ***"

# Visitor counter in the footer. Uses the free Abacus API
# (https://jasoncameron.dev/abacus/) - no account, nothing to install.
# The namespace must be unique to this site; your github.io domain is ideal.
# Only the live site counts visits; `jekyll serve` just shows the number.
counter:
  namespace: "onurbsim.github.io"
  key:       "visits"

# Navigation buttons, in order.
nav:
  - { title: "HOME",    url: "/" }
  - { title: "ABOUT",   url: "/about/" }
  - { title: "NEWS",    url: "/news/" }
  - { title: "GALLERY", url: "/gallery/" }
  - { title: "VIDEOS",  url: "/videos/" }

# Blog/news permalinks
permalink: /news/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
